name: Windows kurulum paketi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler
        run: npm run check

      - name: Python, ffmpeg ve Node.js otomatik kurulum testi
        run: npx electron test/tools-e2e.mjs

      - name: Windows kurulum paketini derle
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Paketin içinde Claude ikilisi var mı?
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Recurse dist/win-unpacked -Filter claude.exe | Select-Object -First 1
          if (-not $bin) { throw "claude.exe paketin içinde bulunamadı" }
          Write-Host "Bulundu: $($bin.FullName)"

      - name: Sürümü oku
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Derlenen dosyayı sakla
        uses: actions/upload-artifact@v4
        with:
          name: Cinecode-Studio-Setup-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: GitHub Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Cinecode Studio ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          body: |
            Windows kurulum paketi. `Cinecode-Studio-Setup-${{ steps.ver.outputs.version }}.exe` dosyasını indirip çalıştırın.
            Paket imzalı değildir; Windows SmartScreen uyarısında "Ek bilgi" → "Yine de çalıştır" deyin.
